data:
  # Paths to BreastDCEDL cohort directories (NIfTI + masks)
  nifti:
    spy1: BreastDCEDL_spy1/spt1_dce
    spy2: ISPY2/data_samples/dce
    duke: BreastDCEDL_duke/duke_dce
  masks:
    spy1: BreastDCEDL_spy1/spy1_mask
    spy2: ISPY2/data_samples/mask
    duke: BreastDCEDL_duke/duke_mask
  metadata:
    spy1: BreastDCEDL_spy1/BreastDCEDL_spy1_metadata.csv
    spy2: ISPY2/ISPY2_metadata.csv
    duke: BreastDCEDL_duke/BrestDCEDL_duke_cropped_metadata.csv
  combined_metadata: BreastDCEDL_metadata.csv
  label_col: pCR
  crop_size: 224
  n_slices: 8

  # Per-VOLUME, channel-SHARED percentile normalization preserves relative
  # intensity between DCE timepoints (the actual signal). `minmax_per_slice`
  # is the legacy per-slice-per-channel rescaling kept only for ablation.
  normalization: percentile
  percentile_lo: 1.0
  percentile_hi: 99.0

  # SER timepoint indices per cohort (paper Section 2.5)
  # I-SPY: timepoints 0, 2, min(last_index, 6)
  # Duke:  timepoints 0, 1, final acquisition
  ser_timepoints:
    spy1: [0, 2, -1]
    spy2: [0, 2, -1]
    duke: [0, 1, -1]

model:
  backbone: google/vit-base-patch16-224-in21k
  num_classes: 2
  # Dropped from 0.3 to 0.1: in phase 1 (head-only) the small head sees
  # too few gradients per step for 0.3 to be productive; phase 2 LLRD
  # provides additional regularization elsewhere.
  dropout: 0.1
  use_clinical: false
  clinical_features: [tum_vol, age, HR, HER2]
  clinical_dim: 4
  # Audit which keys from the paper's .pth get transferred vs dropped.
  # Defaults on for the first run after the load-path rewrite so missed
  # transfers are visible; flip off later for quieter logs.
  debug_pretrained: true
  # When true, warmstart the classifier head's weight+bias from the paper's
  # checkpoint. The May-2026 sanity run with this on showed the head locked
  # in an all-positive prediction collapse that phase 1 head-only training
  # at lr=5e-4 could not escape in 5 epochs (run9 + sanity log both show
  # tr_acc=0.30, sens=1.0, spec=0.0). Flip false to keep the backbone
  # warmstart but reset the head to a fresh Linear + log-prior bias.
  load_paper_classifier: true

training:
  num_epochs: 30
  freeze_epochs: 5
  batch_size: 16
  accum_steps: 2
  backbone_lr: 5e-6
  head_lr: 5e-4
  llrd: 0.85
  weight_decay: 0.01
  # Was 10; tightened to 7 with the new normalization, head-bias init,
  # and class-weights formula so validation can stop sooner once the
  # learning signal flattens.
  loss: focal
  # Focal gamma. 0 reduces FocalLoss to plain CE, 2.0 is the
  # paper-recommended setting. Surfaced as a knob for ablation.
  loss_gamma: 2.0
  patience: 7
  num_workers: 8
  amp_dtype: bf16  # bf16 on A100/H100; falls back to fp16 on V100/older.
  seed: 42

  # Tightened from earlier configs. Breast MRI has a clinically meaningful
  # superior/inferior axis (vertical_flip removed). Rotation/translate/
  # scale tightened to small jitter only; random_erasing was sometimes
  # erasing the tumor itself, so it is off.
  augmentation:
    horizontal_flip: true
    vertical_flip: false
    rotation: 5
    translate: [0.05, 0.05]
    scale: [0.95, 1.05]
    random_erasing: 0.0
    color_jitter: null

wandb:
  enabled: true
  project: breastdcedl-vit
  entity: null
  tags: [vit, pcr, dce-mri]

zenodo:
  record_id: 18114231
  api_url: https://zenodo.org/api/records/18114231
  files:
    ispy2: BreastDCEDL_ISPY2_min_crop.tar.gz
    duke: BreastDCEDL_DUKE_min_crop.tar.gz
    ispy1: BreastDCEDL_ISPY1_min_crop.tar.gz
    demo: BreastDCEDL_demo_data.tar.gz
    models: BreastDCEDL_models.tar.gz
    metadata: BreastDCEDL_metadata_min_crop.csv

evaluation:
  # Subtype stratification for reporting.
  # Column names match the MinCrop metadata (HRposHER2neg / HER2pos / TripleNeg,
  # each encoded 0/1). The paper's headline AUC 0.94 is on HR+/HER2-.
  subtypes:
    HR+/HER2-: {HRposHER2neg: 1}
    HER2+: {HER2pos: 1}
    Triple Negative: {TripleNeg: 1}
