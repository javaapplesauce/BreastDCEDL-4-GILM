# paths
[paths]

# Pre-trained weights
weights_path        = BreastDCEDL_models/breastdcedl_pcr_vit_model_weights.pth
checkpoint_dir      = checkpoints

# data
[data]
spy1_metadata_csv   = BreastDCEDL_spy1/BreastDCEDL_spy1_metadata.csv
duke_metadata_csv   = BreastDCEDL_duke/BreastDCEDL_duke_metadata.csv

nifti_spy1          = BreastDCEDL_spy1/spt1_dce
nifti_spy2          = ISPY2/data_samples/dce
nifti_duke          = BreastDCEDL_duke/duke_dce

mask_spy1           = BreastDCEDL_spy1/spy1_mask
mask_spy2           = ISPY2/data_samples/mask
mask_duke           = BreastDCEDL_duke/duke_mask

label_col           = pCR
crop_size           = 224
n_slices_per_patient = 8

[model]
hf_checkpoint       = google/vit-base-patch16-224-in21k
num_classes         = 2

[training]
# Run history:
# Run 6 (IN21k, lr=4e-6, full, 1 GPU): best val acc=0.667 @ ep6 → overfit ep7+
#
# Optimizations applied for run 7:
#   - Two-phase: 5 epochs head-only (head_lr=5e-4) + 20 epochs LLRD unfreeze
#   - Dropout(0.3) injected before classifier head
#   - n_slices 4→8 (doubles training data)
#   - Augmentation: +RandomAffine, +RandomErasing
#   - weight_decay 5e-3 → 1e-2
#   - Patient-level val accuracy as primary metric
#   - Early stopping patience=8

num_epochs          = 25
freeze_epochs       = 5
physical_batch_size = 8
accum_steps         = 4
lr                  = 8e-6
head_lr             = 5e-4
llrd                = 0.85
weight_decay        = 1e-2
dropout             = 0.3
patience            = 8
num_workers         = 4
freeze_backbone     = false
